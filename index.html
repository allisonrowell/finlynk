<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinLYNK — Decode the Word Problem</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E17; --panel:#121826; --panel2:#1A2235; --line:rgba(255,255,255,.07);
  --text:#E8ECF5; --sub:#8B95A8; --dim:#5A6478;
  --accent:#5B8DEF; --accent2:#4A7BD8;
  --green:#26A69A; --greenL:#4DD0C4; --red:#EF5350; --redL:#FF7B78;
  --gold:#F5B82E; --purple:#9B7BF0; --teal:#2DD4BF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;font-size:15px;line-height:1.5;
}
#app{min-height:100vh;display:flex;flex-direction:column}

/* ── Top bar ── */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;background:rgba(10,14,23,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem;letter-spacing:-.3px;cursor:pointer}
.brand .logo{
  width:28px;height:28px;border-radius:7px;
  background:linear-gradient(135deg,var(--green),var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:900;
}
.brand .x{color:var(--accent)}
.top-right{display:flex;align-items:center;gap:14px}
.streak{display:flex;align-items:center;gap:5px;font-size:.85rem;font-weight:700;color:var(--gold)}
.xp-pill{
  display:flex;align-items:center;gap:5px;font-size:.82rem;font-weight:700;
  color:var(--accent);background:rgba(91,141,239,.12);
  border:1px solid rgba(91,141,239,.25);border-radius:8px;padding:4px 10px;
}

/* ── Layout ── */
.wrap{max-width:820px;width:100%;margin:0 auto;padding:22px 18px 80px}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── Hero ── */
.hero{text-align:center;padding:26px 0 14px}
.hero .kicker{font-size:.72rem;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:2.15rem;font-weight:900;letter-spacing:-1px;margin:10px 0 8px;line-height:1.12}
.hero p{color:var(--sub);font-size:1.02rem;max-width:540px;margin:0 auto}

/* ── Buttons ── */
.btn{
  font-family:'Inter',sans-serif;font-weight:700;font-size:.95rem;
  border:none;border-radius:11px;padding:13px 22px;cursor:pointer;
  transition:transform .12s,box-shadow .12s,background .12s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(91,141,239,.3)}
.btn-primary:hover{background:var(--accent2)}
.btn-green{background:var(--green);color:#04201D;box-shadow:0 6px 20px rgba(38,166,154,.25)}
.btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{background:#222c42}
.btn-sm{padding:8px 14px;font-size:.85rem;border-radius:9px}
.btn-block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ── Section label ── */
.sec-label{font-size:.72rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:26px 0 12px}

/* ── Curriculum cards ── */
.track-grid{display:grid;grid-template-columns:1fr;gap:12px}
.track-card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;
  transition:border-color .15s,transform .15s,background .15s;
}
.track-card:hover{border-color:rgba(91,141,239,.4);transform:translateX(3px);background:var(--panel2)}
.track-card.locked{opacity:.5;cursor:not-allowed}
.track-card.locked:hover{transform:none;border-color:var(--line);background:var(--panel)}
.track-num{
  width:44px;height:44px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:900;
}
.track-info{flex:1;min-width:0}
.track-name{font-weight:800;font-size:1.02rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.track-desc{color:var(--sub);font-size:.85rem;margin-top:2px}
.track-meta{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--dim);margin-top:6px}
.pill{font-size:.66rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.pill-done{background:rgba(38,166,154,.15);color:var(--greenL)}
.pill-prog{background:rgba(245,184,46,.15);color:var(--gold)}
.pill-new{background:rgba(91,141,239,.15);color:var(--accent)}
.pill-soon{background:rgba(255,255,255,.06);color:var(--dim)}
.track-arrow{color:var(--dim);font-size:1.3rem}
.mini-prog{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:8px}
.mini-prog>div{height:100%;background:linear-gradient(90deg,var(--green),var(--accent));border-radius:3px;transition:width .4s}

/* ── Stats row ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat .big{font-size:1.6rem;font-weight:900;letter-spacing:-.5px}
.stat .lbl{font-size:.72rem;color:var(--sub);font-weight:600;margin-top:2px}

/* ── notice banner ── */
.notice{background:rgba(245,184,46,.08);border:1px solid rgba(245,184,46,.25);border-radius:12px;padding:12px 15px;font-size:.82rem;color:var(--sub);margin-top:18px;line-height:1.5}
.notice b{color:var(--gold)}

/* ── Lesson / step top ── */
.lesson-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.lesson-top .crumbs{font-size:.82rem;color:var(--sub);font-weight:600}
.lesson-top .crumbs b{color:var(--text)}
.prog-line{height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:6px}
.prog-line>div{height:100%;background:linear-gradient(90deg,var(--green),var(--accent));border-radius:4px;transition:width .4s}
.step-dots{display:flex;gap:5px;margin-bottom:20px;flex-wrap:wrap}
.step-dots .d{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);cursor:pointer;transition:background .2s}
.step-dots .d.done{background:var(--green)}
.step-dots .d.cur{background:var(--accent)}

/* ── Card ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px}
.card h2{font-size:1.35rem;font-weight:900;letter-spacing:-.4px;margin-bottom:6px}
.lead{color:var(--gold);font-weight:700;font-size:.92rem;margin-bottom:12px}
.card p{color:var(--text);margin:10px 0;font-size:.95rem}
.card p b{color:#fff}
.card ul{margin:10px 0 10px 4px;list-style:none}
.card li{color:var(--text);font-size:.93rem;margin:8px 0;padding-left:22px;position:relative}
.card li:before{content:"→";position:absolute;left:0;color:var(--accent);font-weight:800}

.term-row{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.term{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:.9rem}
.term b{color:var(--accent);font-weight:800}

.concept{margin-top:16px;background:rgba(91,141,239,.08);border:1px solid rgba(91,141,239,.22);border-radius:12px;padding:14px 16px}
.concept.warn{background:rgba(245,184,46,.08);border-color:rgba(245,184,46,.25)}
.concept .ct{font-size:.7rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.concept.warn .ct{color:var(--gold)}
.concept p{font-size:.9rem;margin:6px 0}

/* decision tree */
.tree{margin:16px 0;display:flex;flex-direction:column;gap:10px}
.tnode{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px}
.tnode .q{font-weight:800;font-size:.9rem;color:#fff}
.tnode .a{font-size:.86rem;color:var(--sub);margin-top:5px}
.tnode .a b{color:var(--greenL)}
.tnode.g{border-left-color:var(--green)}
.tnode.gold{border-left-color:var(--gold)}
.tnode.p{border-left-color:var(--purple)}

/* formula chips reference */
.fcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:8px 0}
.fcard .fn{font-weight:800;font-size:.85rem;color:var(--greenL);margin-bottom:3px}
.formula{font-family:'Inter';font-weight:600;font-size:.95rem;color:#fff;letter-spacing:.2px}
.fcard .xl{font-size:.78rem;color:var(--dim);margin-top:4px;font-family:ui-monospace,Menlo,monospace}

/* nav */
.nav-row{display:flex;gap:10px;margin-top:20px}

/* ── Quiz ── */
.quiz-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.quiz-q{font-size:1.08rem;font-weight:700;margin-bottom:16px;line-height:1.4}
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;transition:border-color .15s,background .15s;font-size:.93rem}
.opt:hover{border-color:rgba(91,141,239,.5)}
.opt .key{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0}
.opt.correct{border-color:var(--green);background:rgba(38,166,154,.12)}
.opt.correct .key{background:var(--green);color:#04201D}
.opt.wrong{border-color:var(--red);background:rgba(239,83,80,.1)}
.opt.wrong .key{background:var(--red);color:#fff}
.opt.dis{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-radius:11px;font-size:.9rem;line-height:1.55}
.explain.ok{background:rgba(38,166,154,.1);border:1px solid rgba(38,166,154,.3);color:var(--greenL)}
.explain.no{background:rgba(239,83,80,.1);border:1px solid rgba(239,83,80,.3);color:var(--redL)}

/* ════ DECODER ════ */
.dstage-bar{display:flex;gap:6px;margin-bottom:18px}
.dstep{flex:1;text-align:center;font-size:.62rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);padding-bottom:8px;border-bottom:2px solid rgba(255,255,255,.08);transition:color .2s,border-color .2s}
.dstep.active{color:var(--accent);border-color:var(--accent)}
.dstep.done{color:var(--greenL);border-color:var(--green)}

.ref-tag{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--gold);background:rgba(245,184,46,.12);border-radius:6px;padding:3px 9px;margin-bottom:10px}
.scenario{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:.98rem;line-height:1.6;color:#EDF1F8}
.scenario .num{color:var(--gold);font-weight:800;background:rgba(245,184,46,.1);border-radius:5px;padding:1px 5px}
.ask{margin-top:14px;font-weight:800;font-size:1rem;color:#fff}
.ask .qk{color:var(--accent)}

.stage-title{font-size:.72rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin:18px 0 4px}
.stage-help{color:var(--sub);font-size:.86rem;margin-bottom:14px;line-height:1.5}

/* tag stage */
.tag-list{display:flex;flex-direction:column;gap:10px}
.tag-row{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;transition:border-color .2s}
.tag-row.ok{border-color:var(--green);background:rgba(38,166,154,.08)}
.tag-row.bad{border-color:var(--red);background:rgba(239,83,80,.08)}
.tag-num{font-weight:800;font-size:1rem;color:var(--gold);min-width:96px}
.tag-ctx{font-size:.78rem;color:var(--dim);flex:1;min-width:0}
.tag-row select{
  font-family:'Inter';font-weight:700;font-size:.85rem;color:var(--text);
  background:#0F1522;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;min-width:150px;
}
.tag-row select:focus{outline:none;border-color:var(--accent)}
.mark{font-size:1.05rem;width:20px;text-align:center}

/* formula pick */
.fpick{display:flex;flex-direction:column;gap:10px}
.fopt{background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;padding:14px 15px;cursor:pointer;transition:border-color .15s,background .15s}
.fopt:hover{border-color:rgba(91,141,239,.5)}
.fopt .formula{font-size:.98rem}
.fopt .flabel{font-size:.78rem;color:var(--sub);margin-top:4px}
.fopt.correct{border-color:var(--green);background:rgba(38,166,154,.12)}
.fopt.wrong{border-color:var(--red);background:rgba(239,83,80,.1)}
.fopt.dis{cursor:default}

/* plug in */
.plug{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:4px}
.plug-formula{font-size:1.05rem;font-weight:700;color:#fff;line-height:2.2;text-align:center}
.blank{display:inline-block;width:82px;text-align:center;font-family:'Inter';font-weight:800;font-size:.95rem;color:var(--gold);background:#0F1522;border:1.5px solid var(--line);border-radius:8px;padding:6px 4px;margin:0 2px}
.blank:focus{outline:none;border-color:var(--accent)}
.blank.ok{border-color:var(--green);color:var(--greenL)}
.blank.bad{border-color:var(--red);color:var(--redL)}
.plug-key{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.pk{font-size:.75rem;color:var(--sub);background:#0F1522;border:1px solid var(--line);border-radius:7px;padding:5px 10px}
.pk b{color:var(--greenL)}
.convert{background:rgba(155,123,240,.08);border:1px solid rgba(155,123,240,.25);border-radius:10px;padding:11px 14px;margin-top:12px;font-size:.83rem;color:#C9BEF5}
.convert b{color:var(--purple)}

/* solve reveal */
.solve{display:flex;flex-direction:column;gap:10px}
.sstep{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;opacity:0;transform:translateY(8px);animation:sIn .4s forwards}
@keyframes sIn{to{opacity:1;transform:none}}
.sstep .sn{font-size:.68rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.sstep .sc{font-family:'Inter';font-weight:600;font-size:.95rem;color:#fff}
.sstep .sr{color:var(--greenL);font-weight:800}
.answer-box{background:linear-gradient(135deg,rgba(38,166,154,.15),rgba(91,141,239,.12));border:1px solid rgba(38,166,154,.35);border-radius:12px;padding:18px;text-align:center;margin-top:6px}
.answer-box .albl{font-size:.68rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--greenL)}
.answer-box .aval{font-size:1.9rem;font-weight:900;letter-spacing:-.5px;color:#fff;margin:4px 0}
.meaning{background:rgba(245,184,46,.08);border:1px solid rgba(245,184,46,.22);border-radius:11px;padding:14px 16px;margin-top:12px;font-size:.9rem;line-height:1.55;color:#F0E6CC}
.meaning .ml{font-size:.68rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}

/* problem recap carried onto later stages */
.recap{background:#0F1522;border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin-bottom:16px}
.recap-lbl{font-size:.62rem;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.recap-body{font-size:.9rem;line-height:1.55;color:#D8DEEA}
.recap-body .num{color:var(--gold);font-weight:800;background:rgba(245,184,46,.1);border-radius:5px;padding:1px 5px}
.recap-ask{margin-top:9px;font-weight:800;font-size:.92rem;color:#fff}
.recap-ask .qk{color:var(--accent)}
/* solve: formula header + per-step formula label */
.solve-formula{background:rgba(91,141,239,.09);border:1px solid rgba(91,141,239,.25);border-radius:10px;padding:12px 14px;margin-bottom:12px;text-align:center}
.solve-formula .sfl{font-size:.62rem;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.sstep .sf{font-family:'Inter';font-weight:700;font-size:.82rem;color:var(--sub);margin-bottom:4px}

.feedback{margin-top:14px;padding:12px 15px;border-radius:11px;font-size:.88rem;line-height:1.5;display:none}
.feedback.show{display:block}
.feedback.ok{background:rgba(38,166,154,.1);border:1px solid rgba(38,166,154,.3);color:var(--greenL)}
.feedback.no{background:rgba(239,83,80,.1);border:1px solid rgba(239,83,80,.3);color:var(--redL)}

/* complete */
.complete{text-align:center;padding:40px 0}
.complete .check{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--accent));display:flex;align-items:center;justify-content:center;font-size:2.4rem;margin:0 auto 18px;color:#fff}
.complete h2{font-size:1.7rem;font-weight:900;margin-bottom:8px}
.complete p{color:var(--sub);margin:6px 0}
.reward{display:inline-block;background:rgba(245,184,46,.12);border:1px solid rgba(245,184,46,.3);color:var(--gold);font-weight:800;border-radius:10px;padding:8px 16px;margin-top:12px}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:100}
.footer-note{text-align:center;color:var(--dim);font-size:.76rem;margin-top:30px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti"></canvas>
<script>
/* ════════════════════════════════════════════════════
   FinLYNK — Time Value of Money Decoder
   Content built for IMBA 6071 Financial Management — Exercise 1 topics.
   Single-file, no build, no backend. Progress in localStorage.
════════════════════════════════════════════════════ */
const SAVE_KEY='finlynk_v1';

/* Role palette used across decode "tag" stages */
const ROLES={
  PV:'PV — present (today) value',
  FV:'FV — future / later amount',
  C :'C — repeating payment',
  r :'r — interest / discount rate',
  t :'t — number of periods',
  g :'g — growth rate',
  CF0:'CF₀ — cash flow today (the outlay)',
  CFt:'CFₜ — a project cash flow in a later year',
  Rev:'Revenue',
  Cost:'Cost / operating expense',
  Dep:'Depreciation',
  Tax:'T — tax rate',
  Salv:'Salvage (sale) value',
  BV:'Book value',
  NWC:'NWC — net working capital',
  CR:'coupon rate (annual %)',
  F:'F — face (par) value',
  D0:'D₀ — dividend just paid',
  D1:'D₁ — next year\'s dividend',
  Dt:'Dₜ — a future dividend',
  TV:'terminal value (price at end of stage 1)',
  P0:'P₀ — stock price today',
  Rf:'Rf — risk-free rate',
  beta:'β — beta (systematic risk)',
  MRP:'market risk premium (E[Rm]−Rf)',
  Re:'Rₑ — cost of equity',
  Rd:'R_d — cost of debt (pre-tax)',
  wE:'E/V — equity weight',
  wD:'D/V — debt weight',
  Eq:'E — market value of equity',
  Dbt:'D — market value of debt',
  EBIT:'EBIT — operating profit',
  NOPAT:'NOPAT — after-tax operating profit',
  CapEx:'CapEx — capital spending',
  dNWC:'ΔNWC — change in net working capital',
  IC:'invested capital',
  WACC:'WACC — cost of capital',
  FCF:'FCF — free cash flow',
  skip:'— not plugged in directly'
};
function roleOptions(allowed, sel){
  const keys=['',...allowed,'skip'];
  return keys.map(k=>{
    const label=k===''?'choose…':ROLES[k];
    const s=(k===(sel||''))?' selected':'';
    return `<option value="${k}"${s}>${label}</option>`;
  }).join('');
}
/* Decimal-safe: compares as numbers so .07, 0.07, 0.070 and 7% all match their target */
function numMatch(input, accepts){
  const clean=s=>String(s).trim().toLowerCase().replace(/[$,\s%]/g,'');
  const v=clean(input);
  if(v==='') return false;
  const vn=parseFloat(v);
  return accepts.some(a=>{
    const ac=clean(a), an=parseFloat(ac);
    if(isFinite(vn)&&isFinite(an)){
      return Math.abs(vn-an) <= Math.max(1e-9, Math.abs(an)*1e-6);
    }
    return ac===v;
  });
}

/* ════════════════════════════════════════════════════
   CONTENT
════════════════════════════════════════════════════ */
const TRACKS=[
{
  id:'tvm', name:'Time Value of Money', icon:'⏳', color:'#26A69A',
  desc:'The whole foundation of Exercise 1 — and the skill of turning a word problem into the right formula.',
  steps:[
    /* ---- 1. intuition lesson ---- */
    {type:'lesson', title:'A dollar today ≠ a dollar later',
     lead:'This one idea drives all of corporate finance.',
     body:`<p>Money has a <b>time value</b>: a dollar in your hand today is worth more than a dollar promised next year, because today's dollar can be invested and grow.</p>
     <p>Every Exercise-1 problem is really the same question in disguise: <b>move money across time</b> so you can compare amounts fairly. You either push money <b>forward</b> in time (compounding → a Future Value) or pull it <b>back</b> to today (discounting → a Present Value).</p>`,
     concept:{t:'The trap the pros warn about', body:`<p>Adding up dollars from different years — like a "$4.755M contract" that pays out over 25 years — is a unit error. Year-1 dollars and year-25 dollars aren't the same unit. You must discount them to a common date first.</p>`, warn:true}
    },
    /* ---- 2. the five variables ---- */
    {type:'lesson', title:'The five things every problem gives you',
     lead:'Learn this vocabulary and half the battle is over.',
     body:`<p>Almost every number in a TVM word problem is one of these five roles. Your job when reading is to <b>label each number</b> with its role:</p>`,
     terms:[
       ['PV','the value <i>today</i> (a price, a loan amount, a lump sum now)'],
       ['FV','an amount at some <i>future</i> date'],
       ['C','a <i>repeating</i> equal payment (per year, per month…) — an annuity'],
       ['r','the interest / discount / "opportunity cost" rate per period'],
       ['t','how many periods (years, months) the money moves across'],
     ],
     concept:{t:'The one question that unlocks everything', body:`<p>Before touching a formula, ask: <b>"What am I solving FOR, and what did they GIVE me?"</b> Tag every number with a role, see which role is missing — that missing one is your answer.</p>`}
    },
    /* ---- 3. THE DECODER METHOD (flagship) ---- */
    {type:'lesson', title:'The Decoder Method — picking the formula',
     lead:'A decision tree that tells you which formula to reach for.',
     body:`<p>This is the part that trips everyone up. Once your numbers are tagged, walk this tree in order. The first "yes" gives you your formula.</p>`,
     tree:[
       {c:'', q:'1. Is it ONE single amount moving through time?', a:'Then it\'s a <b>lump sum</b>. Solving for later → <b>FV = PV(1+r)ᵗ</b>. Solving for today → <b>PV = FV/(1+r)ᵗ</b>.'},
       {c:'g', q:'2. Is it the SAME payment every period for a fixed number of periods?', a:'That\'s an <b>annuity</b>. Value today → PV annuity. Value at the end → FV annuity. Solving for the payment itself → <b>PMT</b>.'},
       {c:'gold', q:'3. Does the payment go on FOREVER?', a:'That\'s a <b>perpetuity</b>: <b>PV = C / r</b>. If it grows forever at g, use <b>PV = C / (r − g)</b>.'},
       {c:'p', q:'4. Are the cash flows DIFFERENT each period (uneven)?', a:'Discount each one separately and add: <b>PV = Σ CFₜ/(1+r)ᵗ</b> — the NPV function.'},
     ],
     concept:{t:'Two more reflexes that save points', body:`<p><b>Units must match.</b> If payments are monthly, the rate must be monthly (annual ÷ 12) and t must be in months (years × 12).</p><p><b>Timing.</b> "End of each year" is a normal annuity. A payment "today" sits outside the annuity and is added separately.</p>`}
    },
    /* ---- 4. quiz: cash-flow shape ---- */
    {type:'quiz', q:'"You\'ll receive $300,000 at the end of each year for the next 4 years." What shape is this cash flow?',
     opts:['A single lump sum','An ordinary annuity','A perpetuity','Uneven cash flows'],
     answer:1,
     exp:'Same amount ($300k), fixed number of periods (4), arriving at the end of each period = an ordinary annuity. Reach for the annuity formula.'},
    /* ---- 5. quiz: which formula ---- */
    {type:'quiz', q:'A scholarship will pay $250,000 every year forever. Which formula finds the gift needed today?',
     opts:['FV = PV(1+r)ᵗ','PV = (C/r)[1 − 1/(1+r)ᵗ]','PV = C / r','PV = FV/(1+r)ᵗ'],
     answer:2,
     exp:'"Every year forever" = a perpetuity. Its present value is simply C / r. No t appears because it never ends.'},

    /* ---- 6. DECODE #1 — lump sum PV ---- */
    {type:'decode', title:'Decode: the year-25 payment', ref:'Ex 1 · Problem 1(b)',
     scenario:`A minor-league pitcher's contract pays him <span class="num">$210,000</span> at the end of <span class="num">year 25</span>. The team discounts cash flows at <span class="num">12%</span>.`,
     ask:`What is that single year-25 payment worth <span class="qk">today</span>?`,
     roles:['PV','FV','r','t'],
     givens:[
       {v:'$210,000', ctx:'the amount he receives in year 25', role:'FV'},
       {v:'12%',      ctx:'the discount rate',                 role:'r'},
       {v:'25',       ctx:'years until the payment',           role:'t'},
     ],
     formulas:[
       {f:'PV = FV / (1 + r)ᵗ', label:'Present value of a lump sum', correct:true,
        why:'One single future amount pulled back to today → discount it once by (1+r)ᵗ.'},
       {f:'FV = PV × (1 + r)ᵗ', label:'Future value of a lump sum', correct:false,
        why:'This pushes a present amount forward. But you already have the future amount and want today\'s value — the opposite direction.'},
       {f:'PV = (C/r)[1 − 1/(1+r)ᵗ]', label:'Present value of an annuity', correct:false,
        why:'There\'s no repeating payment here — it\'s one payment in one year. Annuity formulas are overkill and wrong.'},
     ],
     plug:{template:'PV = <b>[FV]</b> / (1 + <b>[r]</b>)<sup><b>[t]</b></sup>',
       blanks:[
         {key:'FV', accept:['210000'], tip:'FV'},
         {key:'r',  accept:['0.12','12','12%'], tip:'r (decimal)'},
         {key:'t',  accept:['25'], tip:'t'},
       ]},
     solve:[
       {f:'(1 + r)ᵗ', c:'(1 + 0.12)²⁵', r:'≈ 17.000'},
       {f:'PV = FV / (1 + r)ᵗ', c:'210,000 / 17.000', r:'≈ $12,352.89'},
     ],
     answer:'$12,352.89',
     meaning:'A $210,000 payment 25 years out is worth only about $12,400 today. Discounting at 12% strips away ~94% of its face value — that\'s how powerful time and rate are over long horizons.'},

    /* ---- 7. DECODE #2 — annuity PV ---- */
    {type:'decode', title:'Decode: four years of payments', ref:'Ex 1 · Problem 2 (Offer C)',
     scenario:`A buyer offers you <span class="num">$300,000</span> at the end of each year for the next <span class="num">4</span> years. Your opportunity cost of capital is <span class="num">7%</span>.`,
     ask:`What is that stream of payments worth <span class="qk">today</span>?`,
     roles:['PV','C','r','t'],
     givens:[
       {v:'$300,000', ctx:'received each year', role:'C'},
       {v:'7%',       ctx:'opportunity cost of capital', role:'r'},
       {v:'4',        ctx:'number of yearly payments', role:'t'},
     ],
     formulas:[
       {f:'PV = (C/r) × [1 − 1/(1+r)ᵗ]', label:'Present value of an annuity', correct:true,
        why:'Same payment, fixed number of periods, valued today → the present value of an ordinary annuity.'},
       {f:'FV = C × [((1+r)ᵗ − 1)/r]', label:'Future value of an annuity', correct:false,
        why:'This gives the value at the END of the 4 years, not today. The question asks for value now.'},
       {f:'PV = C / r', label:'Perpetuity', correct:false,
        why:'This stream stops after 4 years — it isn\'t forever, so the perpetuity formula overstates it badly.'},
     ],
     plug:{template:'PV = (<b>[C]</b> / <b>[r]</b>) × [1 − 1/(1 + <b>[r2]</b>)<sup><b>[t]</b></sup>]',
       blanks:[
         {key:'C',  accept:['300000'], tip:'C'},
         {key:'r',  accept:['0.07','7','7%'], tip:'r'},
         {key:'r2', accept:['0.07','7','7%'], tip:'r again'},
         {key:'t',  accept:['4'], tip:'t'},
       ]},
     solve:[
       {f:'1 − 1/(1 + r)ᵗ', c:'1 − 1/1.07⁴', r:'= 0.2371'},
       {f:'C / r', c:'300,000 / 0.07', r:'= 4,285,714'},
       {f:'(C/r) × [1 − 1/(1 + r)ᵗ]', c:'4,285,714 × 0.2371', r:'≈ $1,016,163.38'},
     ],
     answer:'$1,016,163.38',
     meaning:'The four $300k payments total $1.2M on paper, but they\'re worth about $1.016M today. In the real problem you\'d add the $400k paid up front to get Offer C\'s full value of $1,416,163 — which is why it beats a $1.25M cash offer.'},

    /* ---- 8. DECODE #3 — solve for payment (mortgage) ---- */
    {type:'decode', title:'Decode: the mortgage payment', ref:'Ex 1 · Problem 3(b)',
     scenario:`You finance <span class="num">$446,250</span> with a <span class="num">30</span>-year fixed mortgage at an annual rate of <span class="num">5.4%</span>, paid <span class="num">monthly</span>.`,
     ask:`What is the <span class="qk">monthly payment</span>?`,
     roles:['PV','C','r','t'],
     givens:[
       {v:'$446,250', ctx:'the amount financed (today\'s loan balance)', role:'PV'},
       {v:'5.4%',     ctx:'annual rate — watch the units', role:'r'},
       {v:'30',       ctx:'years — watch the units', role:'t'},
     ],
     formulas:[
       {f:'C = PV × r / [1 − 1/(1+r)ᵗ]', label:'Payment on an annuity (solve for C)', correct:true,
        why:'A loan is a present value; equal monthly payments are the annuity. You know PV and solve for the payment C.'},
       {f:'PV = (C/r)[1 − 1/(1+r)ᵗ]', label:'Present value of an annuity', correct:false,
        why:'Right family, wrong rearrangement — here you already know PV and want C, so use the PMT form.'},
       {f:'FV = PV(1+r)ᵗ', label:'Future value of a lump sum', correct:false,
        why:'There\'s no single lump sum growing — the loan is repaid through a stream of equal payments.'},
     ],
     plug:{template:'C = <b>[PV]</b> × <b>[r]</b> / [1 − 1/(1 + <b>[r2]</b>)<sup><b>[t]</b></sup>]',
       blanks:[
         {key:'PV', accept:['446250'], tip:'PV'},
         {key:'r',  accept:['0.0045','0.045','.0045'], tip:'monthly r'},
         {key:'r2', accept:['0.0045','0.045','.0045'], tip:'monthly r'},
         {key:'t',  accept:['360'], tip:'months'},
       ]},
     convert:`Because payments are <b>monthly</b>, convert the units first: monthly rate r = 5.4% ÷ 12 = <b>0.0045</b>, and periods t = 30 × 12 = <b>360</b>. This unit conversion is the #1 place people lose the point.`,
     solve:[
       {f:'monthly r = annual r / 12', c:'0.054 / 12', r:'= 0.0045'},
       {f:'t = years × 12', c:'30 × 12', r:'= 360'},
       {f:'1 − 1/(1 + r)ᵗ', c:'1 − 1/1.0045³⁶⁰', r:'= 0.8012'},
       {f:'C = PV × r / [1 − 1/(1 + r)ᵗ]', c:'446,250 × 0.0045 / 0.8012', r:'≈ $2,505.83'},
     ],
     answer:'$2,505.83 / month',
     meaning:'The monthly payment is about $2,506. Notice the trick was never the formula — it was converting the annual 5.4% and 30 years into a monthly 0.45% and 360 periods before plugging in.'},

    /* ---- 9. DECODE #4 — perpetuity + growing ---- */
    {type:'decode', title:'Decode: the endowment', ref:'Ex 1 · Problem 5(a & b)',
     scenario:`A donor wants a scholarship that pays <span class="num">$250,000</span> every year <span class="num">forever</span>, first payment in one year. The endowment earns <span class="num">6.5%</span> per year.`,
     ask:`How large must the gift be <span class="qk">today</span>?`,
     roles:['C','r','g'],
     givens:[
       {v:'$250,000', ctx:'annual scholarship payment', role:'C'},
       {v:'6.5%',     ctx:'expected annual return', role:'r'},
       {v:'forever',  ctx:'a signal, not a number to plug', role:'skip'},
     ],
     formulas:[
       {f:'PV = C / r', label:'Level perpetuity', correct:true,
        why:'A constant payment that never ends is a perpetuity — its present value is just C divided by r.'},
       {f:'PV = (C/r)[1 − 1/(1+r)ᵗ]', label:'Annuity', correct:false,
        why:'An annuity stops after t periods. This payment is forever, so there is no t to plug in.'},
       {f:'PV = C / (r − g)', label:'Growing perpetuity', correct:false,
        why:'That\'s the right tool only once the payment grows. Part (a) is a level payment, so g = 0 and it reduces to C/r.'},
     ],
     plug:{template:'PV = <b>[C]</b> / <b>[r]</b>',
       blanks:[
         {key:'C', accept:['250000'], tip:'C'},
         {key:'r', accept:['0.065','6.5','6.5%'], tip:'r'},
       ]},
     solve:[
       {f:'PV = C / r', c:'250,000 / 0.065', r:'≈ $3,846,153.85'},
     ],
     answer:'$3,846,154',
     meaning:'It takes ~$3.85M today to fund $250k a year forever at 6.5%. In part (b), if the award must grow 2.5%/yr, you switch to the growing perpetuity C/(r−g) = 250,000/0.04 = $6,250,000 — growth makes a perpetual promise dramatically more expensive.'},

    /* ---- 10. wrap quiz ---- */
    {type:'quiz', q:'The real skill Exercise 1 tests is…',
     opts:['Memorizing formulas perfectly','Reading the word problem, tagging each number, and picking the matching formula','Doing arithmetic fast in your head','Using Excel functions only'],
     answer:1,
     exp:'The formulas are on the sheet. Points are won by decoding the words into roles and choosing the right tool — exactly the loop you just practiced. Keep drilling these until the decision tree is automatic.'},
  ]
},
{
  id:'npv', name:'Capital Budgeting — NPV & IRR', icon:'📊', color:'#5B8DEF',
  desc:'Should you build the project? Turn a messy business story into a cash-flow timeline, discount it, and decide.',
  steps:[
    /* ---- 1. what NPV asks ---- */
    {type:'lesson', title:'What NPV really asks',
     lead:'One number decides every project.',
     body:`<p><b>Net Present Value (NPV)</b> compares what a project is worth today against what it costs you:</p>
     <p style="text-align:center;font-weight:800;color:#fff">NPV = (present value of all future cash flows) − (what you invest today)</p>
     <p>Every future dollar is discounted back to today first (that's all of Track 1), then netted against the up-front cost.</p>`,
     concept:{t:'The decision rule — memorize this', body:`<p><b>NPV &gt; 0 → accept</b> the project (it adds value). <b>NPV &lt; 0 → reject</b> it. That's the entire point of the exercise: a yes/no backed by a number.</p>`}
    },
    /* ---- 2. the timeline ---- */
    {type:'lesson', title:'Build the cash-flow timeline',
     lead:'Get the timeline right and the math is easy.',
     body:`<p>Every capital-budgeting problem is really a <b>timeline</b>. Cash you spend is negative; cash you receive is positive.</p>`,
     terms:[
       ['CF₀','the net cash flow <i>today</i> — equipment + working capital, as a big <b>negative</b> number'],
       ['CFₜ','the net cash flow in each operating year (usually positive)'],
       ['Terminal','extra cash in the <i>final</i> year: after-tax salvage + recovered working capital'],
     ],
     concept:{t:'Where points are lost', body:`<p>The #1 error is a <b>sign mistake</b> — forgetting the initial cost is negative, or dropping the working-capital recovery at the end. Draw the timeline before you touch a formula.</p>`, warn:true}
    },
    /* ---- 3. OCF ---- */
    {type:'lesson', title:'Operating Cash Flow — the engine',
     lead:'This is the number people get wrong.',
     body:`<p>Each operating year's cash flow is <b>not</b> just revenue minus costs — taxes and depreciation change it:</p>
     <p style="text-align:center;font-weight:800;color:#fff">OCF = (Rev − Cost − Dep) × (1 − T) + Dep</p>
     <p>Depreciation isn't cash you pay, but it lowers your taxable income — so you subtract it to get taxable profit, tax that, then <b>add it back</b> because you never actually spent it.</p>`,
     terms:[
       ['EBIT','Rev − Cost − Dep — your taxable operating profit'],
       ['Tax shield','depreciation cuts your tax bill even though it isn\'t a cash cost'],
     ],
     concept:{t:'Same number, three ways', body:`<p>You'll see it written as <b>OCF = EBIT(1−T) + Dep</b> or <b>(Rev−Cost)(1−T) + T×Dep</b>. All identical — use whichever the problem makes easiest.</p>`}
    },
    /* ---- 4. terminal year ---- */
    {type:'lesson', title:'The final year — salvage & working capital',
     lead:'Two things people forget at the end.',
     body:`<p>In the <b>last</b> year, on top of that year's OCF you add two things:</p>
     <ul>
       <li><b>After-tax salvage.</b> You're taxed only on the <i>gain</i> over book value: <b>Salvage − T × (Salvage − Book value)</b>. Sell <i>below</i> book value and the loss gives you a tax <i>refund</i> — cash goes up.</li>
       <li><b>Working-capital recovery.</b> The NWC you tied up at the start comes back to you.</li>
     </ul>`,
     concept:{t:'Book value', body:`<p><b>Book value = original cost − accumulated depreciation.</b> If salvage &gt; book value you owe tax on the gain; if salvage &lt; book value the loss shields tax.</p>`}
    },
    /* ---- 5. decoder method + IRR ---- */
    {type:'lesson', title:'The Decoder Method — and IRR',
     lead:'The four-step checklist, plus NPV\'s twin.',
     body:`<p>Once you\'ve read the story, walk this every time:</p>`,
     tree:[
       {c:'', q:'1. What leaves your pocket at time 0?', a:'Sum every up-front outflow — equipment + initial working capital — and make it <b>negative</b>. That\'s CF₀.'},
       {c:'g', q:'2. What\'s the cash flow each operating year?', a:'Compute <b>OCF = (Rev − Cost − Dep)(1−T) + Dep</b>. Level revenues → same OCF each year.'},
       {c:'gold', q:'3. Anything extra in the final year?', a:'Add <b>after-tax salvage</b> and <b>recovered working capital</b> to the last year\'s OCF.'},
       {c:'p', q:'4. Discount everything and net it out.', a:'<b>NPV = CF₀ + Σ CFₜ/(1+r)ᵗ</b>. If NPV &gt; 0, accept.'},
     ],
     concept:{t:'IRR — NPV\'s twin', body:`<p><b>IRR is the discount rate that makes NPV exactly zero.</b> Decision rule: accept if <b>IRR &gt; r</b> (the required return). By hand it\'s trial-and-error / Excel <span style="font-family:monospace">=IRR()</span>; NPV is the tie-breaker when the two ever disagree.</p>`}
    },
    /* ---- 6. quiz: decision rule ---- */
    {type:'quiz', q:'At the required return, a project has NPV = +$1.2 million. You should…',
     opts:['Reject it — positive NPV means overpriced','Accept it — it adds value','Only accept if the IRR is negative','You can\'t tell without the payback period'],
     answer:1,
     exp:'NPV > 0 means the project is worth more than it costs at your required return — it creates value, so you accept. That is the whole decision rule.'},
    /* ---- 7. quiz: depreciation ---- */
    {type:'quiz', q:'Depreciation shows up in the OCF formula because…',
     opts:['It\'s a cash cost you pay out each year','It isn\'t cash, but it shields income from taxes','It increases revenue','It is the salvage value'],
     answer:1,
     exp:'Depreciation is a non-cash charge. It lowers taxable income (the tax shield), so you subtract it to compute tax, then add it back because no cash actually left — the net effect is the taxes you saved.'},

    /* ---- 8. DECODE #1 — NPV of given cash flows ---- */
    {type:'decode', title:'Decode: is this project worth it?', ref:'Capital Budgeting · core NPV',
     scenario:`A project costs <span class="num">$10,000</span> today and is expected to return <span class="num">$6,000</span> at the end of year 1 and <span class="num">$7,000</span> at the end of year 2. Your required return is <span class="num">10%</span>.`,
     ask:`What is the project's <span class="qk">NPV</span>?`,
     roles:['CF0','CFt','r','t'],
     givens:[
       {v:'$10,000', ctx:'paid up front, today', role:'CF0'},
       {v:'$6,000 & $7,000', ctx:'received end of years 1 and 2', role:'CFt'},
       {v:'10%', ctx:'required return / discount rate', role:'r'},
     ],
     formulas:[
       {f:'NPV = CF₀ + CF₁/(1+r) + CF₂/(1+r)²', label:'Net present value (discount every flow, net the cost)', correct:true,
        why:'Discount each future cash flow to today and add the (negative) up-front cost. That\'s NPV.'},
       {f:'NPV = CF₁/(1+r) + CF₂/(1+r)²', label:'PV of the inflows only', correct:false,
        why:'This forgets the $10,000 you invested. Without subtracting the cost you get present value, not NPV.'},
       {f:'NPV = CF₀ + CF₁ + CF₂', label:'Just add the cash flows', correct:false,
        why:'This ignores the time value of money — year-2 dollars aren\'t worth the same as today\'s. You must discount first.'},
     ],
     plug:{template:'NPV = <b>[CF0]</b> + <b>[CF1]</b>/(1 + <b>[r]</b>) + <b>[CF2]</b>/(1 + <b>[r2]</b>)²',
       blanks:[
         {key:'CF0', accept:['-10000'], tip:'CF₀ (−)'},
         {key:'CF1', accept:['6000'], tip:'CF₁'},
         {key:'CF2', accept:['7000'], tip:'CF₂'},
         {key:'r',   accept:['0.10','0.1','10'], tip:'r'},
         {key:'r2',  accept:['0.10','0.1','10'], tip:'r'},
       ]},
     convert:`The up-front cost is a cash <b>outflow</b>, so enter CF₀ as a <b>negative</b> number: −10,000.`,
     solve:[
       {f:'CF₁/(1+r)', c:'6,000 / 1.10', r:'= $5,454.55'},
       {f:'CF₂/(1+r)²', c:'7,000 / 1.21', r:'= $5,785.12'},
       {f:'NPV = CF₀ + PV₁ + PV₂', c:'−10,000 + 5,454.55 + 5,785.12', r:'≈ $1,239.67'},
     ],
     answer:'NPV ≈ $1,240',
     meaning:'NPV is positive (~$1,240), so the project earns more than your 10% required return — accept it. The whole game is just discounting each flow and netting the cost.'},

    /* ---- 9. DECODE #2 — operating cash flow ---- */
    {type:'decode', title:'Decode: the yearly operating cash flow', ref:'Capital Budgeting · OCF',
     scenario:`A new plant generates <span class="num">$5,500,000</span> in revenue and <span class="num">$2,500,000</span> in costs each year. Annual depreciation is <span class="num">$1,250,000</span> and the tax rate is <span class="num">35%</span>.`,
     ask:`What is the annual <span class="qk">operating cash flow</span> (OCF)?`,
     roles:['Rev','Cost','Dep','Tax'],
     givens:[
       {v:'$5,500,000', ctx:'revenue each year', role:'Rev'},
       {v:'$2,500,000', ctx:'costs each year', role:'Cost'},
       {v:'$1,250,000', ctx:'annual depreciation', role:'Dep'},
       {v:'35%', ctx:'tax rate', role:'Tax'},
     ],
     formulas:[
       {f:'OCF = (Rev − Cost − Dep)(1 − T) + Dep', label:'Operating cash flow', correct:true,
        why:'Tax the operating profit (Rev−Cost−Dep), then add depreciation back because it was never a cash outflow.'},
       {f:'OCF = Rev − Cost − Dep', label:'Earnings before tax', correct:false,
        why:'This is pre-tax accounting profit, not cash. It ignores taxes and never adds depreciation back.'},
       {f:'OCF = (Rev − Cost)(1 − T)', label:'After-tax profit, no depreciation', correct:false,
        why:'This drops depreciation entirely — you lose the tax shield, which understates the real cash flow.'},
     ],
     plug:{template:'OCF = (<b>[Rev]</b> − <b>[Cost]</b> − <b>[Dep]</b>) × (1 − <b>[T]</b>) + <b>[Dep2]</b>',
       blanks:[
         {key:'Rev',  accept:['5500000'], tip:'Rev'},
         {key:'Cost', accept:['2500000'], tip:'Cost'},
         {key:'Dep',  accept:['1250000'], tip:'Dep'},
         {key:'T',    accept:['0.35','35'], tip:'T'},
         {key:'Dep2', accept:['1250000'], tip:'Dep again'},
       ]},
     solve:[
       {f:'EBIT = Rev − Cost − Dep', c:'5,500,000 − 2,500,000 − 1,250,000', r:'= $1,750,000'},
       {f:'after-tax = EBIT × (1 − T)', c:'1,750,000 × 0.65', r:'= $1,137,500'},
       {f:'OCF = after-tax + Dep', c:'1,137,500 + 1,250,000', r:'= $2,387,500'},
     ],
     answer:'OCF = $2,387,500 / yr',
     meaning:'Each operating year throws off ~$2.39M in cash — more than the $2.25M after-tax accounting profit would suggest, because depreciation shielded $1.25M from a 35% tax. That tax shield is why depreciation belongs in the formula.'},

    /* ---- 10. DECODE #3 — after-tax salvage / terminal ---- */
    {type:'decode', title:'Decode: cash at the finish line', ref:'Capital Budgeting · terminal year',
     scenario:`At the end of the project you sell the equipment for <span class="num">$1,200,000</span>. Its book value at that point is <span class="num">$1,250,000</span>. The tax rate is <span class="num">35%</span>, and you also recover <span class="num">$500,000</span> of working capital.`,
     ask:`What is the total <span class="qk">terminal-year</span> cash flow from these items?`,
     roles:['Salv','BV','Tax','NWC'],
     givens:[
       {v:'$1,200,000', ctx:'sale (salvage) price of the equipment', role:'Salv'},
       {v:'$1,250,000', ctx:'book value when sold', role:'BV'},
       {v:'35%', ctx:'tax rate', role:'Tax'},
       {v:'$500,000', ctx:'working capital tied up at the start', role:'NWC'},
     ],
     formulas:[
       {f:'Terminal = [Salv − T(Salv − BV)] + NWC', label:'After-tax salvage + working-capital recovery', correct:true,
        why:'Tax applies only to the gain over book value; then add back the working capital you recover.'},
       {f:'Terminal = Salv + NWC', label:'Salvage plus NWC, no tax', correct:false,
        why:'This skips the tax adjustment on the sale. Here it happens to be a small loss, but you must always run the tax step.'},
       {f:'Terminal = Salv(1 − T) + NWC', label:'Tax the whole salvage', correct:false,
        why:'Wrong — you\'re taxed on the gain (Salv − BV), not the entire sale price.'},
     ],
     plug:{template:'Terminal = ( <b>[Salv]</b> − <b>[T]</b> × ( <b>[Salv2]</b> − <b>[BV]</b> ) ) + <b>[NWC]</b>',
       blanks:[
         {key:'Salv',  accept:['1200000'], tip:'Salv'},
         {key:'T',     accept:['0.35','35'], tip:'T'},
         {key:'Salv2', accept:['1200000'], tip:'Salv'},
         {key:'BV',    accept:['1250000'], tip:'BV'},
         {key:'NWC',   accept:['500000'], tip:'NWC'},
       ]},
     solve:[
       {f:'gain (loss) = Salv − BV', c:'1,200,000 − 1,250,000', r:'= −$50,000'},
       {f:'tax on gain = T × (Salv − BV)', c:'0.35 × (−50,000)', r:'= −$17,500'},
       {f:'after-tax salvage = Salv − tax', c:'1,200,000 − (−17,500)', r:'= $1,217,500'},
       {f:'Terminal = salvage + NWC', c:'1,217,500 + 500,000', r:'= $1,717,500'},
     ],
     answer:'Terminal CF = $1,717,500',
     meaning:'Selling $50k below book value created a $17,500 tax refund, so after-tax salvage is actually more than the sale price. Add the $500k of working capital coming back and the final year gets a $1.72M boost on top of its operating cash flow.'},

    /* ---- 11. DECODE #4 — capstone: crab plant ---- */
    {type:'decode', title:'Decode: the whole project', ref:'Capital Budgeting · capstone',
     scenario:`Deadliest Catch Seafood builds a king-crab plant. Putting the pieces together: it costs <span class="num">$5.0M</span> to build plus <span class="num">$0.5M</span> of working capital up front; it earns an operating cash flow of <span class="num">$2,387,500</span> in each of years 1–3; and year 3 gets an extra <span class="num">$1,717,500</span> from after-tax salvage and recovered working capital. Discount rate <span class="num">10%</span>.`,
     ask:`What is the project's <span class="qk">NPV</span> — build it or not?`,
     roles:['CF0','CFt','r'],
     givens:[
       {v:'−$5,500,000', ctx:'time 0: $5.0M plant + $0.5M working capital', role:'CF0'},
       {v:'$2,387,500', ctx:'years 1 & 2: operating cash flow (Decode #2)', role:'CFt'},
       {v:'$4,105,000', ctx:'year 3: OCF $2,387,500 + terminal $1,717,500 (Decode #3)', role:'CFt'},
       {v:'10%', ctx:'discount rate', role:'r'},
     ],
     formulas:[
       {f:'NPV = CF₀ + Σ CFₜ/(1+r)ᵗ', label:'Discount every year and net the outlay', correct:true,
        why:'You\'ve already built each year\'s net cash flow — now discount years 1–3 and add the negative CF₀.'},
       {f:'NPV = CF₀ + Σ CFₜ', label:'Add the yearly cash flows undiscounted', correct:false,
        why:'No discounting — this ignores that a year-3 dollar is worth less than a year-1 dollar.'},
       {f:'NPV = Σ CFₜ/(1+r)ᵗ', label:'Discount the inflows only', correct:false,
        why:'Forgets the $5.5M you put in at time 0. NPV must include CF₀.'},
     ],
     plug:{template:'NPV = <b>[CF0]</b> + <b>[CF1]</b>/(1+<b>[r]</b>) + <b>[CF2]</b>/(1+<b>[r2]</b>)² + <b>[CF3]</b>/(1+<b>[r3]</b>)³',
       blanks:[
         {key:'CF0', accept:['-5500000'], tip:'CF₀ (−)'},
         {key:'CF1', accept:['2387500'], tip:'CF₁'},
         {key:'CF2', accept:['2387500'], tip:'CF₂'},
         {key:'CF3', accept:['4105000'], tip:'CF₃'},
         {key:'r',   accept:['0.10','0.1','10'], tip:'r'},
         {key:'r2',  accept:['0.10','0.1','10'], tip:'r'},
         {key:'r3',  accept:['0.10','0.1','10'], tip:'r'},
       ]},
     convert:`Years 1 and 2 are just the OCF ($2,387,500). Year 3 = OCF $2,387,500 + terminal $1,717,500 = <b>$4,105,000</b>. CF₀ is negative: −$5,500,000.`,
     solve:[
       {f:'CF₁/(1+r)', c:'2,387,500 / 1.10', r:'= $2,170,455'},
       {f:'CF₂/(1+r)²', c:'2,387,500 / 1.21', r:'= $1,973,140'},
       {f:'CF₃/(1+r)³', c:'4,105,000 / 1.331', r:'= $3,084,147'},
       {f:'NPV = CF₀ + PV₁ + PV₂ + PV₃', c:'−5,500,000 + 2,170,455 + 1,973,140 + 3,084,147', r:'≈ $1,727,742'},
     ],
     answer:'NPV ≈ $1.73M',
     meaning:'NPV ≈ +$1.73M and the IRR works out to ≈ 25.4% — well above the 10% required return. Both signals say build the plant. Notice the real work was upstream: OCF and the terminal year. Once the timeline is built, NPV is just Track-1 discounting.'},

    /* ---- 12. wrap quiz: IRR ---- */
    {type:'quiz', q:'IRR is best described as…',
     opts:['The rate that makes NPV equal zero','The project\'s profit margin','The tax rate applied to the gain','The rate the bank charges to borrow'],
     answer:0,
     exp:'IRR is the discount rate at which NPV = 0. You accept when IRR exceeds your required return. In the crab plant, IRR ≈ 25.4% > 10%, which agrees with the positive NPV.'},
  ]
},
{
  id:'bonds', name:'Interest Rates & Bond Pricing', icon:'📉', color:'#F5B82E',
  desc:'Price a bond as what it really is — a stream of coupons plus a face value — and nail the semi-annual conversion.',
  steps:[
    /* ---- 1. anatomy ---- */
    {type:'lesson', title:'A bond is two cash flows you can already price',
     lead:'You lend money; you get paid back in two ways.',
     body:`<p>When you buy a bond, you're lending money to the issuer. In return you receive:</p>
     <ul>
       <li>a stream of fixed <b>coupon</b> payments (an annuity), and</li>
       <li>the <b>face value</b> (par) back at maturity (a lump sum).</li>
     </ul>
     <p>The bond's price is simply the present value of both, discounted at the market yield.</p>`,
     terms:[
       ['Coupon (C)','the fixed periodic interest payment — an annuity'],
       ['Face value (F)','the principal repaid at maturity — usually $1,000'],
       ['Yield to maturity (YTM)','the market discount rate — what investors currently demand'],
     ],
     concept:{t:'You already have the tools', body:`<p>Coupons are the <b>annuity</b> from Track 1. Face value is a <b>lump sum</b>. Bond pricing is just those two, added together.</p>`}
    },
    /* ---- 2. the formula ---- */
    {type:'lesson', title:'The bond pricing formula',
     lead:'Annuity of coupons + discounted face value.',
     body:`<p style="text-align:center;font-weight:800;color:#fff">Price = C × [1 − 1/(1+r)ᵗ]/r  +  F/(1+r)ᵗ</p>
     <p>where C = coupon per period, r = YTM per period, t = number of periods, F = face value. The first term prices the coupons (an annuity); the second prices the face value (a lump sum).</p>`,
     concept:{t:'A zero-coupon bond', body:`<p>If a bond pays no coupons, C = 0 and the first term vanishes: <b>Price = F/(1+r)ᵗ</b> — a pure lump sum, exactly like Track 1.</p>`}
    },
    /* ---- 3. semi-annual trap ---- */
    {type:'lesson', title:'The semi-annual trap',
     lead:'Most bonds pay twice a year. Convert first.',
     body:`<p>When coupons are paid <b>semi-annually</b>, turn everything into per-period terms <i>before</i> using the formula:</p>
     <ul>
       <li>Coupon: <b>C = (coupon rate × Face) / 2</b></li>
       <li>Rate: <b>r = YTM / 2</b></li>
       <li>Periods: <b>t = years × 2</b></li>
     </ul>
     <p>It's the exact same move as monthly mortgage payments in Track 1.</p>`,
     concept:{t:'The most common bond error', body:`<p>Forgetting to convert — or converting when the coupons are actually <b>annual</b>. Always check how often coupons are paid before you plug in.</p>`, warn:true}
    },
    /* ---- 4. premium / par / discount ---- */
    {type:'lesson', title:'Premium, par, or discount?',
     lead:'Compare the coupon rate to the yield.',
     body:`<p>The relationship between the coupon rate and the YTM tells you the price <i>before</i> you compute anything:</p>
     <ul>
       <li>Coupon rate &gt; YTM → <b>premium</b> (price &gt; face) — it pays more than the market demands</li>
       <li>Coupon rate = YTM → <b>par</b> (price = face)</li>
       <li>Coupon rate &lt; YTM → <b>discount</b> (price &lt; face)</li>
     </ul>
     <p>And because the yield sits in the denominator, <b>prices move opposite to yields</b> — rates up, prices down.</p>`,
     concept:{t:'Use it as a sanity check', body:`<p>If you compute a premium bond's price <i>below</i> par, you made an arithmetic error. The coupon-vs-yield comparison catches it instantly.</p>`}
    },
    /* ---- 5. decoder method ---- */
    {type:'lesson', title:'The Decoder Method — for bonds',
     lead:'Four checks, every bond.',
     body:`<p>Read the problem, then walk this:</p>`,
     tree:[
       {c:'', q:'1. Pull the four raw numbers.', a:'Coupon rate, face value (F), YTM, and years to maturity.'},
       {c:'g', q:'2. How often are coupons paid?', a:'Semi-annual? Convert: <b>C = rate×F/2, r = YTM/2, t = years×2</b>. Annual? Use them as-is.'},
       {c:'gold', q:'3. Premium or discount? (sanity check)', a:'Coupon rate vs YTM tells you whether the price should land above or below face — before you compute.'},
       {c:'p', q:'4. Price both pieces and add.', a:'<b>Price = C×[1−1/(1+r)ᵗ]/r + F/(1+r)ᵗ</b> — coupons (annuity) plus face (lump sum).'},
     ],
     concept:{t:'YTM is the bond\'s IRR', body:`<p>The yield to maturity is exactly the bond's internal rate of return — the single rate that makes the price equal the present value of all its cash flows. Bonds tie Tracks 1 and 2 together.</p>`}
    },
    /* ---- 6. quiz premium ---- */
    {type:'quiz', q:'A bond has a 6% coupon rate but its yield to maturity is 5%. It will trade at…',
     opts:['A discount (below $1,000)','Par (exactly $1,000)','A premium (above $1,000)','You can\'t tell without computing'],
     answer:2,
     exp:'Coupon rate (6%) > YTM (5%) means the bond pays more than the market currently demands, so buyers bid its price above face value — a premium.'},
    /* ---- 7. quiz semi-annual ---- */
    {type:'quiz', q:'A 20-year bond pays coupons semi-annually. In the pricing formula, the number of periods t is…',
     opts:['20','40','10','2'],
     answer:1,
     exp:'Semi-annual = 2 payments per year × 20 years = 40 periods. And the per-period rate is the annual YTM ÷ 2. Convert both together, every time.'},

    /* ---- 8. DECODE #1 — coupon payment conversion ---- */
    {type:'decode', title:'Decode: the coupon payment', ref:'Bonds · semi-annual conversion',
     scenario:`A bond has a <span class="num">6%</span> coupon rate on a <span class="num">$1,000</span> face value, with coupons paid <span class="num">semi-annually</span>.`,
     ask:`What is the dollar <span class="qk">coupon payment</span> each period?`,
     roles:['CR','F'],
     givens:[
       {v:'6%', ctx:'the annual coupon rate', role:'CR'},
       {v:'$1,000', ctx:'face (par) value', role:'F'},
       {v:'semi-annually', ctx:'how often coupons are paid — a signal', role:'skip'},
     ],
     formulas:[
       {f:'C = (coupon rate × Face) / 2', label:'Semi-annual coupon payment', correct:true,
        why:'The coupon rate is annual: multiply by face for the yearly coupon, then split in half because it\'s paid twice a year.'},
       {f:'C = coupon rate × Face', label:'Full annual coupon', correct:false,
        why:'That\'s the whole year\'s coupon. Paid semi-annually, each individual payment is only half of it.'},
       {f:'C = Face / coupon rate', label:'Face divided by rate', correct:false,
        why:'Dividing face by the rate is meaningless — the coupon is a percentage OF the face value, not face divided by it.'},
     ],
     plug:{template:'C = ( <b>[CR]</b> × <b>[F]</b> ) / 2',
       blanks:[
         {key:'CR', accept:['0.06','6'], tip:'coupon rate'},
         {key:'F',  accept:['1000'], tip:'F'},
       ]},
     solve:[
       {f:'annual coupon = rate × Face', c:'0.06 × 1,000', r:'= $60'},
       {f:'semi-annual = annual / 2', c:'60 / 2', r:'= $30'},
     ],
     answer:'C = $30 per period',
     meaning:'Every six months the bondholder receives $30. This $30 is the annuity payment you\'ll discount in the price formula — get this conversion right and the rest of the bond falls into place.'},

    /* ---- 9. DECODE #2 — zero-coupon = lump sum ---- */
    {type:'decode', title:'Decode: a zero-coupon bond', ref:'Bonds · zero-coupon',
     scenario:`A <span class="num">zero-coupon</span> bond pays <span class="num">$1,000</span> at maturity in <span class="num">10 years</span>. Its yield to maturity is <span class="num">4%</span>, and it pays no coupons at all.`,
     ask:`What is the bond's <span class="qk">price today</span>?`,
     roles:['F','r','t'],
     givens:[
       {v:'$1,000', ctx:'paid at maturity (the face value)', role:'F'},
       {v:'4%', ctx:'yield to maturity', role:'r'},
       {v:'10 years', ctx:'time to maturity', role:'t'},
       {v:'zero-coupon', ctx:'no coupon payments — a signal', role:'skip'},
     ],
     formulas:[
       {f:'Price = F / (1 + r)ᵗ', label:'Discount the single face-value payment', correct:true,
        why:'With no coupons, the only cash flow is the face value at maturity — so the price is that one lump sum discounted to today. It\'s a Track-1 present value.'},
       {f:'Price = C×[1−1/(1+r)ᵗ]/r + F/(1+r)ᵗ', label:'Full coupon-bond formula', correct:false,
        why:'A zero has no coupons (C = 0), so the entire annuity term drops out — you\'re left with just F/(1+r)ᵗ.'},
       {f:'Price = F × (1 + r)ᵗ', label:'Compound the face value forward', correct:false,
        why:'That gives a future value. Pricing means discounting the future payment back to today, not growing it.'},
     ],
     plug:{template:'Price = <b>[F]</b> / (1 + <b>[r]</b>)<sup><b>[t]</b></sup>',
       blanks:[
         {key:'F', accept:['1000'], tip:'F'},
         {key:'r', accept:['0.04','4'], tip:'r'},
         {key:'t', accept:['10'], tip:'t'},
       ]},
     solve:[
       {f:'(1 + r)ᵗ', c:'1.04¹⁰', r:'≈ 1.4802'},
       {f:'Price = F / (1 + r)ᵗ', c:'1,000 / 1.4802', r:'≈ $675.56'},
     ],
     answer:'Price ≈ $675.56',
     meaning:'A zero-coupon bond is nothing more than a single discounted lump sum — pure Track 1. You pay $675.56 today to receive $1,000 in ten years; the gap is your 4% yield compounding.'},

    /* ---- 10. DECODE #3 — full semi-annual premium bond ---- */
    {type:'decode', title:'Decode: price the whole bond', ref:'Bonds · exam-style (semi-annual)',
     scenario:`Consider a <span class="num">20-year</span> bond with a <span class="num">6%</span> coupon rate paid <span class="num">semi-annually</span> on a <span class="num">$1,000</span> face value. Its yield to maturity is <span class="num">5%</span>.`,
     ask:`What is the <span class="qk">price</span> of the bond?`,
     roles:['C','r','t','F'],
     givens:[
       {v:'6% semi-annual', ctx:'coupon → C = 0.06×1,000/2 = $30 per period', role:'C'},
       {v:'5%', ctx:'YTM → per-period rate = 5%/2', role:'r'},
       {v:'20 years', ctx:'→ number of semi-annual periods = 20×2', role:'t'},
       {v:'$1,000', ctx:'face value repaid at maturity', role:'F'},
     ],
     formulas:[
       {f:'Price = C×[1 − 1/(1+r)ᵗ]/r + F/(1+r)ᵗ', label:'Coupons (annuity) + face (lump sum)', correct:true,
        why:'A bond is an annuity of coupons plus a lump-sum face value. Discount both at the per-period YTM.'},
       {f:'Price = C×[1 − 1/(1+r)ᵗ]/r', label:'Coupons only', correct:false,
        why:'This prices only the coupons and forgets the $1,000 face value returned at maturity.'},
       {f:'Price = F/(1+r)ᵗ', label:'Face value only', correct:false,
        why:'This prices only the face value and ignores all 40 coupon payments.'},
     ],
     plug:{template:'Price = <b>[C]</b> × [1 − 1/(1 + <b>[r]</b>)<sup><b>[t]</b></sup>] / <b>[r2]</b> + <b>[F]</b> / (1 + <b>[r3]</b>)<sup><b>[t2]</b></sup>',
       blanks:[
         {key:'C',  accept:['30'], tip:'C'},
         {key:'r',  accept:['0.025','2.5'], tip:'r/period'},
         {key:'t',  accept:['40'], tip:'t'},
         {key:'r2', accept:['0.025','2.5'], tip:'r/period'},
         {key:'F',  accept:['1000'], tip:'F'},
         {key:'r3', accept:['0.025','2.5'], tip:'r/period'},
         {key:'t2', accept:['40'], tip:'t'},
       ]},
     convert:`Semi-annual — convert first: C = 6%×$1,000/2 = <b>$30</b>, per-period r = 5%/2 = <b>0.025</b>, and t = 20×2 = <b>40</b> periods.`,
     solve:[
       {f:'coupon C = rate × Face / 2', c:'0.06 × 1,000 / 2', r:'= $30'},
       {f:'per-period r = YTM / 2', c:'0.05 / 2', r:'= 0.025'},
       {f:'periods t = years × 2', c:'20 × 2', r:'= 40'},
       {f:'annuity factor = [1 − 1/(1+r)ᵗ]/r', c:'[1 − 1/1.025⁴⁰] / 0.025', r:'≈ 25.103'},
       {f:'coupons PV = C × factor', c:'30 × 25.103', r:'≈ $753.08'},
       {f:'face PV = F / (1+r)ᵗ', c:'1,000 / 1.025⁴⁰', r:'≈ $372.43'},
       {f:'Price = coupons PV + face PV', c:'753.08 + 372.43', r:'≈ $1,125.51'},
     ],
     answer:'Price ≈ $1,125.51',
     meaning:'The 6% coupon beats the 5% market yield, so investors pay a premium — $1,125.51, above the $1,000 face. Whenever the coupon rate exceeds the YTM, the bond trades above par.'},

    /* ---- 11. DECODE #4 — annual discount bond ---- */
    {type:'decode', title:'Decode: a discount bond', ref:'Bonds · exam-style (annual)',
     scenario:`A <span class="num">30-year</span> bond has a <span class="num">5%</span> coupon paid <span class="num">annually</span> on a <span class="num">$1,000</span> face value. Its yield to maturity is <span class="num">8%</span>.`,
     ask:`What is the <span class="qk">price</span>?`,
     roles:['C','r','t','F'],
     givens:[
       {v:'5% annual', ctx:'coupon → C = 0.05×1,000 = $50 (annual, no halving)', role:'C'},
       {v:'8%', ctx:'YTM — annual, used as-is', role:'r'},
       {v:'30 years', ctx:'annual periods, used as-is', role:'t'},
       {v:'$1,000', ctx:'face value', role:'F'},
     ],
     formulas:[
       {f:'Price = C×[1 − 1/(1+r)ᵗ]/r + F/(1+r)ᵗ', label:'Coupons (annuity) + face (lump sum)', correct:true,
        why:'Same formula as always — coupons plus face. These coupons are annual, so no halving or doubling.'},
       {f:'Price = C×[1 − 1/(1+r)ᵗ]/r', label:'Coupons only', correct:false,
        why:'Forgets the $1,000 face value repaid at maturity.'},
       {f:'Price = F/(1+r)ᵗ', label:'Face value only', correct:false,
        why:'Ignores 30 years of coupon payments.'},
     ],
     plug:{template:'Price = <b>[C]</b> × [1 − 1/(1 + <b>[r]</b>)<sup><b>[t]</b></sup>] / <b>[r2]</b> + <b>[F]</b> / (1 + <b>[r3]</b>)<sup><b>[t2]</b></sup>',
       blanks:[
         {key:'C',  accept:['50'], tip:'C'},
         {key:'r',  accept:['0.08','8'], tip:'r'},
         {key:'t',  accept:['30'], tip:'t'},
         {key:'r2', accept:['0.08','8'], tip:'r'},
         {key:'F',  accept:['1000'], tip:'F'},
         {key:'r3', accept:['0.08','8'], tip:'r'},
         {key:'t2', accept:['30'], tip:'t'},
       ]},
     convert:`Coupons are paid <b>annually</b> here — do NOT convert. C = 5%×$1,000 = $50, r = 8% = 0.08, t = 30. (Halving is only for semi-annual bonds.)`,
     solve:[
       {f:'coupon C = rate × Face', c:'0.05 × 1,000', r:'= $50 (annual)'},
       {f:'annuity factor = [1 − 1/(1+r)ᵗ]/r', c:'[1 − 1/1.08³⁰] / 0.08', r:'≈ 11.258'},
       {f:'coupons PV = C × factor', c:'50 × 11.258', r:'≈ $562.89'},
       {f:'face PV = F / (1+r)ᵗ', c:'1,000 / 1.08³⁰', r:'≈ $99.38'},
       {f:'Price = coupons PV + face PV', c:'562.89 + 99.38', r:'≈ $662.27'},
     ],
     answer:'Price ≈ $662.27',
     meaning:'Here the 5% coupon is below the 8% market yield, so the bond sells at a discount — $662.27, well under par. And note: coupons were annual, so no halving. Whether to convert for semi-annual is the single most common bond mistake.'},

    /* ---- 12. wrap quiz ---- */
    {type:'quiz', q:'When market interest rates rise, the prices of existing bonds…',
     opts:['Rise','Fall','Stay the same','Always move to exactly par'],
     answer:1,
     exp:'Bond prices move opposite to yields. A higher discount rate lowers the present value of the bond\'s fixed coupons and face value, so its price falls.'},
  ]
},
{
  id:'stock', name:'Stock Valuation (DDM)', icon:'📈', color:'#9B7BF0',
  desc:'Value a share as the present value of its dividends — and answer the exam\'s favorite question: is it overvalued?',
  steps:[
    /* ---- 1. what a stock is worth ---- */
    {type:'lesson', title:'What a stock is worth',
     lead:'A share is a claim on a stream of dividends.',
     body:`<p>A stock's value today is the <b>present value of all the cash it will ever pay you</b> — its future dividends, discounted at your required return.</p>
     <p>Those dividends stretch out forever and usually grow over time, so we need a shortcut for an infinite growing stream: the <b>Gordon Growth Model</b>.</p>`,
     concept:{t:'Same idea as Tracks 1–3', body:`<p>This is the identical present-value logic — now applied to an infinite, growing stream of dividends instead of coupons or a lump sum.</p>`}
    },
    /* ---- 2. gordon ---- */
    {type:'lesson', title:'The Gordon Growth Model',
     lead:'Constant-growth dividends = a growing perpetuity.',
     body:`<p>If dividends grow at a constant rate g forever, the stock is worth:</p>
     <p style="text-align:center;font-weight:800;color:#fff">P₀ = D₁ / (r − g)</p>
     <p>where D₁ is <b>next year's</b> dividend, r the required return, g the growth rate. Two cautions:</p>
     <ul>
       <li>Use <b>D₁, not D₀</b>. If you're given the dividend just paid (D₀), grow it first: D₁ = D₀(1+g).</li>
       <li>It only works when <b>g &lt; r</b>. If g ≥ r the formula breaks down.</li>
     </ul>`,
     concept:{t:'You have seen this before', body:`<p>It's literally Track 1's growing perpetuity, <b>PV = C/(r−g)</b>, with the dividend as the cash flow.</p>`}
    },
    /* ---- 3. rearrange ---- */
    {type:'lesson', title:'Is it overvalued? Flip the formula',
     lead:'Back out the r or g the market price implies.',
     body:`<p>The same equation answers the exam's favorite question — <i>is this stock overvalued?</i> — by solving for what the current price implies:</p>
     <ul>
       <li>Implied return: <b>r = D₁/P₀ + g</b></li>
       <li>Implied growth: <b>g = r − D₁/P₀</b></li>
     </ul>
     <p>Compare that number to what's realistic. If the price only makes sense with unrealistically high growth, the stock is overvalued.</p>`,
     concept:{t:'Return = yield + growth', body:`<p>D₁/P₀ is the <b>dividend yield</b>. So r = dividend yield + growth — your return comes from the cash you collect <i>and</i> the growth you get.</p>`}
    },
    /* ---- 4. multi-stage ---- */
    {type:'lesson', title:'Multi-stage: fast now, steady later',
     lead:'Real firms grow fast for a while, then settle.',
     body:`<p>The two-stage model handles it in two moves:</p>
     <ul>
       <li>Grow and discount each dividend through the high-growth years, one at a time.</li>
       <li>At the end of that phase the rest is a constant-growth perpetuity — value it with Gordon to get a <b>terminal value</b>, then discount that lump back too.</li>
     </ul>
     <p style="text-align:center;font-weight:800;color:#fff">P₀ = Σ Dₜ/(1+r)ᵗ + TV/(1+r)ᴺ,&nbsp;&nbsp;TV = D₍ₙ₊₁₎/(r − g₂)</p>`,
     concept:{t:'The classic mistake', body:`<p>The terminal value sits at the <b>end of year N</b>, so it's discounted N years back — the same as year N's dividend. Forgetting to discount the terminal value is the most common two-stage error.</p>`, warn:true}
    },
    /* ---- 5. decoder method ---- */
    {type:'lesson', title:'The Decoder Method — for stocks',
     lead:'Four checks, every valuation.',
     body:`<p>Read the problem, then walk this:</p>`,
     tree:[
       {c:'', q:'1. Which dividend do you have — D₀ or D₁?', a:'"Just paid" is D₀ — grow it: <b>D₁ = D₀(1+g)</b>. The formula always uses next year\'s dividend.'},
       {c:'g', q:'2. One growth rate forever, or two stages?', a:'One constant g → <b>Gordon: P₀ = D₁/(r−g)</b>. Fast then steady → two-stage.'},
       {c:'gold', q:'3. Solving for price, or for r / g?', a:'Given the price, rearrange: <b>r = D₁/P₀ + g</b> or <b>g = r − D₁/P₀</b> to test over/undervaluation.'},
       {c:'p', q:'4. Two-stage? Dividends + terminal value.', a:'Grow & discount each early dividend, then add <b>TV = D₍ₙ₊₁₎/(r−g₂)</b> discounted back N years.'},
     ],
     concept:{t:'Always check', body:`<p>Confirm <b>g &lt; r</b> before trusting any Gordon number — otherwise the model is invalid.</p>`}
    },
    /* ---- 6. quiz g<r ---- */
    {type:'quiz', q:'The Gordon Growth Model P₀ = D₁/(r − g) requires that…',
     opts:['g > r','g = r','g < r','g = 0'],
     answer:2,
     exp:'Growth must be below the required return. If g ≥ r the denominator is zero or negative and the price is meaningless — a stream growing faster than you discount it would be worth infinity.'},
    /* ---- 7. quiz D1 not D0 ---- */
    {type:'quiz', q:'A stock just paid a $2.00 dividend (D₀) and grows 5%. The number that goes in the Gordon numerator is…',
     opts:['$2.00','$2.10','$1.90','$0.10'],
     answer:1,
     exp:'The model uses NEXT year\'s dividend: D₁ = D₀(1+g) = 2.00 × 1.05 = $2.10 — not the $2.00 already paid.'},

    /* ---- 8. DECODE #1 — next year's dividend ---- */
    {type:'decode', title:'Decode: next year\'s dividend', ref:'Stocks · growing the dividend',
     scenario:`A company just paid an annual dividend of <span class="num">$4.00</span> per share. Its dividend is expected to grow <span class="num">5%</span> every year.`,
     ask:`What is <span class="qk">next year's dividend</span>, D₁?`,
     roles:['D0','g'],
     givens:[
       {v:'$4.00', ctx:'the dividend just paid (D₀)', role:'D0'},
       {v:'5%', ctx:'annual dividend growth rate', role:'g'},
     ],
     formulas:[
       {f:'D₁ = D₀ × (1 + g)', label:'Grow the dividend one year', correct:true,
        why:'Next year\'s dividend is this year\'s grown by one year of g.'},
       {f:'D₁ = D₀ / (1 + g)', label:'Discount the dividend', correct:false,
        why:'Dividing shrinks it — that\'s discounting. Growth means you multiply.'},
       {f:'D₁ = D₀ × g', label:'Dividend times growth', correct:false,
        why:'That gives only the dollar increase ($0.20), not the new dividend. You need D₀ plus its growth.'},
     ],
     plug:{template:'D₁ = <b>[D0]</b> × (1 + <b>[g]</b>)',
       blanks:[
         {key:'D0', accept:['4','4.00'], tip:'D₀'},
         {key:'g',  accept:['0.05','5'], tip:'g'},
       ]},
     solve:[
       {f:'D₁ = D₀ × (1 + g)', c:'4.00 × 1.05', r:'= $4.20'},
     ],
     answer:'D₁ = $4.20',
     meaning:'Next year\'s dividend is $4.20. This matters because the Gordon model discounts next year\'s dividend (D₁), never the one already paid (D₀).'},

    /* ---- 9. DECODE #2 — Gordon price ---- */
    {type:'decode', title:'Decode: the stock\'s value', ref:'Stocks · Gordon Growth',
     scenario:`A stock is expected to pay a <span class="num">$4.20</span> dividend next year (D₁). Its dividends will grow <span class="num">5%</span> per year forever, and investors require a <span class="num">12%</span> return.`,
     ask:`What is the stock <span class="qk">worth today</span>?`,
     roles:['D1','g','r'],
     givens:[
       {v:'$4.20', ctx:'next year\'s dividend (D₁)', role:'D1'},
       {v:'5%', ctx:'constant dividend growth, forever', role:'g'},
       {v:'12%', ctx:'required return / discount rate', role:'r'},
     ],
     formulas:[
       {f:'P₀ = D₁ / (r − g)', label:'Gordon Growth (growing perpetuity)', correct:true,
        why:'A dividend growing at a constant rate forever is a growing perpetuity — value today is D₁ divided by (r − g).'},
       {f:'P₀ = D₁ / (r + g)', label:'Rate plus growth in denominator', correct:false,
        why:'Growth makes the stock worth MORE, so it\'s subtracted: (r − g). Adding it would understate the price.'},
       {f:'P₀ = D₁ / r', label:'No-growth perpetuity', correct:false,
        why:'This ignores growth entirely. With g = 5% the true denominator is 0.07, not 0.12.'},
     ],
     plug:{template:'P₀ = <b>[D1]</b> / ( <b>[r]</b> − <b>[g]</b> )',
       blanks:[
         {key:'D1', accept:['4.20','4.2'], tip:'D₁'},
         {key:'r',  accept:['0.12','12'], tip:'r'},
         {key:'g',  accept:['0.05','5'], tip:'g'},
       ]},
     solve:[
       {f:'r − g', c:'0.12 − 0.05', r:'= 0.07'},
       {f:'P₀ = D₁ / (r − g)', c:'4.20 / 0.07', r:'= $60.00'},
     ],
     answer:'P₀ = $60.00',
     meaning:'The stock is worth $60 today. Gordon Growth is just Track 1\'s growing perpetuity — a dividend stream growing forever, valued at D₁/(r−g). Note g (5%) < r (12%), so the model is valid.'},

    /* ---- 10. DECODE #3 — solve for implied growth ---- */
    {type:'decode', title:'Decode: is it overvalued?', ref:'Stocks · implied growth',
     scenario:`A stock currently trades at <span class="num">$60</span>. It's expected to pay a <span class="num">$4.20</span> dividend next year, and investors require a <span class="num">12%</span> return.`,
     ask:`What constant dividend <span class="qk">growth rate</span> does the $60 price imply?`,
     roles:['P0','D1','r'],
     givens:[
       {v:'$60', ctx:'current stock price (P₀)', role:'P0'},
       {v:'$4.20', ctx:'next year\'s dividend (D₁)', role:'D1'},
       {v:'12%', ctx:'required return', role:'r'},
     ],
     formulas:[
       {f:'g = r − D₁/P₀', label:'Gordon, rearranged for g', correct:true,
        why:'Rearrange P₀ = D₁/(r−g): the growth the market is pricing in is r minus the dividend yield.'},
       {f:'g = r + D₁/P₀', label:'Return plus dividend yield', correct:false,
        why:'Sign error. From P₀ = D₁/(r−g) you get r − g = D₁/P₀, so g = r − D₁/P₀.'},
       {f:'g = D₁/P₀ − r', label:'Yield minus return', correct:false,
        why:'Also flipped — this comes out negative here. Solve carefully: r − g = D₁/P₀ → g = r − D₁/P₀.'},
     ],
     plug:{template:'g = <b>[r]</b> − <b>[D1]</b> / <b>[P0]</b>',
       blanks:[
         {key:'r',  accept:['0.12','12'], tip:'r'},
         {key:'D1', accept:['4.20','4.2'], tip:'D₁'},
         {key:'P0', accept:['60'], tip:'P₀'},
       ]},
     solve:[
       {f:'dividend yield = D₁/P₀', c:'4.20 / 60', r:'= 0.07'},
       {f:'g = r − D₁/P₀', c:'0.12 − 0.07', r:'= 0.05 = 5%'},
     ],
     answer:'g = 5%',
     meaning:'The $60 price implies the market expects 5% dividend growth forever. If your own analysis says growth will be lower, the stock looks overvalued; higher, undervalued. That is exactly how the exam\'s "is it overvalued?" questions work.'},

    /* ---- 11. DECODE #4 — two-stage capstone ---- */
    {type:'decode', title:'Decode: the two-stage stock', ref:'Stocks · capstone (two-stage)',
     scenario:`The Southern Company just paid a <span class="num">$2.32</span> dividend. Analysts expect it to grow <span class="num">3.84%</span> for the next 3 years, then <span class="num">2.5%</span> forever after. The required return is <span class="num">8%</span>.`,
     ask:`What is the stock's <span class="qk">value today</span> — and is $51.82 too rich?`,
     roles:['Dt','TV','r'],
     givens:[
       {v:'$2.41', ctx:'year-1 dividend: D₁ = 2.32×1.0384', role:'Dt'},
       {v:'$2.50', ctx:'year-2 dividend (D₂)', role:'Dt'},
       {v:'$2.60', ctx:'year-3 dividend (D₃)', role:'Dt'},
       {v:'$48.41', ctx:'terminal value at end of year 3', role:'TV'},
       {v:'8%', ctx:'required return', role:'r'},
     ],
     formulas:[
       {f:'P₀ = D₁/(1+r) + D₂/(1+r)² + (D₃ + TV₃)/(1+r)³', label:'Discount each dividend + the terminal value', correct:true,
        why:'Discount the three explicit dividends, and add the terminal value at year 3 (discounted back 3 years alongside D₃).'},
       {f:'P₀ = D₁/(1+r) + D₂/(1+r)² + D₃/(1+r)³', label:'Dividends only, no terminal value', correct:false,
        why:'This throws away everything after year 3. The terminal value captures all those later dividends — you must include it.'},
       {f:'P₀ = D₁ + D₂ + D₃ + TV₃', label:'Add them undiscounted', correct:false,
        why:'No discounting — a year-3 dollar isn\'t worth a today dollar. Every term must be discounted back.'},
     ],
     plug:{template:'P₀ = <b>[D1]</b>/(1+<b>[r]</b>) + <b>[D2]</b>/(1+<b>[r2]</b>)² + ( <b>[D3]</b> + <b>[TV]</b> )/(1+<b>[r3]</b>)³',
       blanks:[
         {key:'D1', accept:['2.41'], tip:'D₁'},
         {key:'r',  accept:['0.08','8'], tip:'r'},
         {key:'D2', accept:['2.50','2.5'], tip:'D₂'},
         {key:'r2', accept:['0.08','8'], tip:'r'},
         {key:'D3', accept:['2.60','2.6'], tip:'D₃'},
         {key:'TV', accept:['48.41'], tip:'TV₃'},
         {key:'r3', accept:['0.08','8'], tip:'r'},
       ]},
     convert:`Grow the dividend: D₁=2.32×1.0384=<b>$2.41</b>, D₂=<b>$2.50</b>, D₃=<b>$2.60</b>. Then D₄=2.60×1.025=$2.66, so the terminal value at year 3 is TV₃ = D₄/(r−g₂) = 2.66/(0.08−0.025) = <b>$48.41</b>.`,
     solve:[
       {f:'D₁/(1+r)', c:'2.41 / 1.08', r:'= $2.23'},
       {f:'D₂/(1+r)²', c:'2.50 / 1.1664', r:'= $2.14'},
       {f:'(D₃ + TV₃)/(1+r)³', c:'(2.60 + 48.41) / 1.259712', r:'= $40.49'},
       {f:'P₀ = sum of the three', c:'2.23 + 2.14 + 40.49', r:'≈ $44.87'},
     ],
     answer:'P₀ ≈ $44.87',
     meaning:'The DDM values Southern at about $44.87, but it trades at $51.82 — so the model flags it as overvalued. The whole method: grow the dividends through the high-growth years, cap it with a Gordon terminal value, and discount everything back to today.'},

    /* ---- 12. wrap quiz ---- */
    {type:'quiz', q:'Your valuation only holds if the stock grows dividends 9% forever, but its industry grows ~3%. The stock is most likely…',
     opts:['Undervalued','Fairly valued','Overvalued','Impossible to judge'],
     answer:2,
     exp:'The current price only makes sense under an unrealistically high 9% perpetual growth assumption. When a price requires heroic growth to justify it, that\'s a classic overvaluation signal.'},
  ]
},
{
  id:'wacc', name:'Risk, Return & the Cost of Capital', icon:'⚖️', color:'#EF5350',
  desc:'A firm\'s blended discount rate: cost of equity from CAPM, after-tax cost of debt, weighted by capital structure.',
  steps:[
    /* ---- 1. risk & beta ---- */
    {type:'lesson', title:'Risk, return, and beta',
     lead:'Higher risk demands a higher expected return.',
     body:`<p>Investors won't hold a risky asset unless it's expected to pay more. The risk that matters is <b>systematic</b> (market-wide) risk — the part you can't diversify away — and it's measured by <b>beta (β)</b>.</p>
     <ul>
       <li>β = 1 → moves with the market</li>
       <li>β &gt; 1 → amplifies market swings (riskier → higher required return)</li>
       <li>β &lt; 1 → dampens them (safer → lower required return)</li>
     </ul>`,
     concept:{t:'Where this is heading', body:`<p>Beta feeds the CAPM formula, which gives a firm's <b>cost of equity</b> — the biggest piece of its overall cost of capital (WACC).</p>`}
    },
    /* ---- 2. CAPM ---- */
    {type:'lesson', title:'CAPM — the cost of equity',
     lead:'Start risk-free, add pay for risk.',
     body:`<p>The Capital Asset Pricing Model gives the return shareholders require:</p>
     <p style="text-align:center;font-weight:800;color:#fff">Rₑ = Rf + β × (E[Rm] − Rf)</p>
